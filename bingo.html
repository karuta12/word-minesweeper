<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>5×5 しりとりビンゴ（頻度バランス配分版）</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }
      h1 {
        color: #333;
      }
      .setup,
      .game-control,
      .name-settings {
        margin-bottom: 20px;
      }
      select,
      button,
      input {
        font-size: 16px;
        padding: 8px 12px;
        margin: 5px;
      }
      button {
        cursor: pointer;
      }

      .name-inputs {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .name-inputs label {
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .name-inputs input {
        width: 100px;
      }

      .turn-indicator {
        font-size: 20px;
        font-weight: bold;
        color: #d9534f;
        background: #fff3cd;
        border: 1px solid #ffeeba;
        padding: 10px;
        border-radius: 6px;
        max-width: 400px;
        margin: 15px auto;
      }

      .boards-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }
      .player-card {
        background: #fff;
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        position: relative;
      }
      .player-card.active-turn {
        border-color: #d9534f;
        box-shadow: 0 0 10px rgba(217, 83, 79, 0.5);
      }
      .player-card h3 {
        margin-top: 0;
        color: #007bff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
      }

      .status-badges {
        display: flex;
        gap: 5px;
        font-size: 13px;
      }
      .reach-count {
        background: #ffc107;
        color: #333;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: bold;
      }
      .bingo-count {
        background: #28a745;
        color: white;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: bold;
      }

      .bingo-grid {
        display: grid;
        grid-template-columns: repeat(5, 55px);
        grid-template-rows: repeat(5, 55px);
        gap: 4px;
      }
      .cell {
        background: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        border-radius: 4px;
        user-select: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .cell.center {
        background: #ffc107;
        color: #fff;
      }
      .cell.checked {
        background: #28a745;
        color: #fff;
        text-decoration: line-through;
      }

      /* 勝利ポップアップのモーダル */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        animation: popUp 0.3s ease-out;
        max-width: 400px;
        width: 90%;
      }
      .modal-content h2 {
        color: #28a745;
        margin-top: 0;
        font-size: 28px;
      }
      .modal-content p {
        font-size: 20px;
        font-weight: bold;
        color: #333;
      }
      @keyframes popUp {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .history-box {
        margin-top: 20px;
        background: #fff;
        padding: 10px;
        border-radius: 6px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid #ddd;
        text-align: left;
      }
      .history-box h4 {
        margin: 0 0 5px 0;
        color: #555;
      }
      .log-list {
        font-size: 14px;
        color: #666;
        max-height: 80px;
        overflow-y: auto;
        margin: 0;
        padding-left: 20px;
      }
      .error-msg {
        color: #dc3545;
        font-weight: bold;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h1>5×5 しりとりビンゴ</h1>

    <div class="setup">
      <label for="playerCount">人数：</label>
      <select id="playerCount" onchange="updateNameInputs()">
        <option value="2">2人</option>
        <option value="3" selected>3人</option>
        <option value="4">4人</option>
      </select>
      <button onclick="generateBoards()">カードを新しく配り直す</button>
    </div>

    <div class="name-settings">
      <div id="nameInputsContainer" class="name-inputs"></div>
    </div>

    <div id="turnIndicator" class="turn-indicator">現在の番：-</div>

    <div class="game-control">
      <form id="wordForm" onsubmit="submitWord(event)">
        <label for="wordInput">言葉を入力：</label>
        <input
          type="text"
          id="wordInput"
          placeholder="例: りんご"
          autocomplete="off"
          required
        />
        <button type="submit">送信・決定</button>
      </form>
      <div id="errorMsg" class="error-msg"></div>
    </div>

    <div id="boards" class="boards-container"></div>

    <div class="history-box">
      <h4>これまでのワード履歴：</h4>
      <ul id="historyList" class="log-list"></ul>
    </div>

    <!-- 勝利演出用モーダル -->
    <div id="winModal" class="modal">
      <div class="modal-content">
        <h2>🎉 BINGO! 🎉</h2>
        <p id="winnerText">プレイヤー名 が 2列ビンゴを達成して勝利しました！</p>
        <button
          onclick="closeModal()"
          style="
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
          "
        >
          閉じる
        </button>
      </div>
    </div>

    <script>
      // ご提示いただいた出現頻度の高い順に並べた文字リスト
      const frequencySortedChars = [
        "の",
        "に",
        "た",
        "い",
        "は",
        "を",
        "と",
        "る",
        "が",
        "し",
        "で",
        "て",
        "な",
        "か",
        "れ",
        "ら",
        "も",
        "う",
        "す",
        "り",
        "こ",
        "だ",
        "ま",
        "さ",
        "き",
        "め",
        "く",
        "あ",
        "け",
        "ど",
        "ん",
        "え",
        "よ",
        "つ",
        "や",
        "そ",
        "わ",
        "ち",
        "み",
        "せ",
        "ろ",
        "ば",
        "お",
        "じ",
        "べ",
        "ず",
        "げ",
        "ほ",
        "へ",
        "び",
        "む",
        "ご",
        "ね",
        "ぶ",
        "ぐ",
        "ぎ",
        "ひ",
        "づ",
        "ぼ",
        "ざ",
        "ふ",
        "ぞ",
        "ゆ",
        "ぜ",
        "ぬ",
        "ぱ",
        "ぴ",
        "ぽ",
        "ぷ",
        "ぺ",
        "ぢ",
        "ー",
      ];

      let wordHistory = [];
      let lastChar = null;
      let currentTurnIndex = 0;
      let playerNames = [];
      let gameFinished = false;

      function updateNameInputs() {
        const count = parseInt(document.getElementById("playerCount").value);
        const container = document.getElementById("nameInputsContainer");
        container.innerHTML = "";

        for (let i = 0; i < count; i++) {
          const defaultName = `プレイヤー ${i + 1}`;
          const label = document.createElement("label");
          label.innerHTML = `P${i + 1}: <input type="text" id="playerName_${i}" value="${defaultName}" oninput="syncPlayerNames()">`;
          container.appendChild(label);
        }
      }

      function syncPlayerNames() {
        const count = parseInt(document.getElementById("playerCount").value);
        playerNames = [];
        for (let i = 0; i < count; i++) {
          const input = document.getElementById(`playerName_${i}`);
          const name = input
            ? input.value.trim() || `プレイヤー ${i + 1}`
            : `プレイヤー ${i + 1}`;
          playerNames.push(name);

          const titleTextEl = document.getElementById(`cardTitleText_${i}`);
          if (titleTextEl) {
            titleTextEl.innerText = name;
          }
        }
        updateTurnDisplay();
      }

      function updateTurnDisplay() {
        if (playerNames.length === 0) return;
        const indicator = document.getElementById("turnIndicator");
        if (gameFinished) {
          indicator.innerText = `🏆 ゲーム終了！`;
          return;
        }
        indicator.innerText = `👉 現在の番： ${playerNames[currentTurnIndex]} さん`;

        document.querySelectorAll(".player-card").forEach((card, idx) => {
          if (idx === currentTurnIndex) {
            card.classList.add("active-turn");
          } else {
            card.classList.remove("active-turn");
          }
        });
      }

      function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function generateBoards() {
        const count = parseInt(document.getElementById("playerCount").value);
        gameFinished = false;
        updateNameInputs();
        syncPlayerNames();

        const container = document.getElementById("boards");
        container.innerHTML = "";
        wordHistory = [];
        lastChar = null;
        currentTurnIndex = 0;

        document.getElementById("historyList").innerHTML = "";
        document.getElementById("errorMsg").innerText = "";

        // 「り」を除外したリストを作成（頻度順を維持）
        let charsWithoutRi = frequencySortedChars.filter(
          (char) => char !== "り",
        );

        // スネークドラフト方式で各プレイヤーに文字を配分する
        // 例）3人の場合: P0,P1,P2,P2,P1,P0,P0,P1,P2,...
        // これにより各プレイヤーが頻度の高い文字・低い文字を均等に受け取る
        let playerCharLists = Array.from({ length: count }, () => []);
        let forward = true;
        let p = 0;
        for (let i = 0; i < charsWithoutRi.length; i++) {
          playerCharLists[p].push(charsWithoutRi[i]);
          if (forward) {
            p++;
            if (p >= count) { p = count - 1; forward = false; }
          } else {
            p--;
            if (p < 0) { p = 0; forward = true; }
          }
        }

        // 各プレイヤーのリストから24文字をシャッフルして選ぶ
        for (let p = 0; p < count; p++) {
          playerCharLists[p] = shuffle(playerCharLists[p]).slice(0, 24);
        }

        for (let p = 0; p < count; p++) {
          let cardChars = playerCharLists[p];
          cardChars.splice(12, 0, "り"); // 中央（12番目）に「り」を配置

          const cardDiv = document.createElement("div");
          cardDiv.className = "player-card";
          cardDiv.dataset.playerIndex = p;
          if (p === 0) cardDiv.classList.add("active-turn");

          cardDiv.innerHTML = `
                    <h3>
                        <span id="cardTitleText_${p}">${playerNames[p]}</span>
                        <span class="status-badges">
                            <span class="reach-count" id="reachCount_${p}">リーチ: 0</span>
                            <span class="bingo-count" id="bingoCount_${p}">ビンゴ: 0</span>
                        </span>
                    </h3>
                `;

          const gridDiv = document.createElement("div");
          gridDiv.className = "bingo-grid";

          cardChars.forEach((char, index) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.innerText = char;
            cell.dataset.char = char;

            if (index === 12) {
              cell.classList.add("center", "checked");
            }

            cell.addEventListener("click", () => {
              cell.classList.toggle("checked");
              updateCardStatus();
            });

            gridDiv.appendChild(cell);
          });

          cardDiv.appendChild(gridDiv);
          container.appendChild(cardDiv);
        }
        updateTurnDisplay();
        updateCardStatus();
      }

      function evaluateCard(cardElement) {
        const cells = cardElement.querySelectorAll(".cell");
        let grid = [];
        for (let r = 0; r < 5; r++) {
          let row = [];
          for (let c = 0; c < 5; c++) {
            row.push(cells[r * 5 + c].classList.contains("checked"));
          }
          grid.push(row);
        }

        let lines = [];
        for (let r = 0; r < 5; r++) {
          lines.push([
            grid[r][0],
            grid[r][1],
            grid[r][2],
            grid[r][3],
            grid[r][4],
          ]);
        }
        for (let c = 0; c < 5; c++) {
          lines.push([
            grid[0][c],
            grid[1][c],
            grid[2][c],
            grid[3][c],
            grid[4][c],
          ]);
        }
        lines.push([
          grid[0][0],
          grid[1][1],
          grid[2][2],
          grid[3][3],
          grid[4][4],
        ]);
        lines.push([
          grid[0][4],
          grid[1][3],
          grid[2][2],
          grid[3][1],
          grid[4][0],
        ]);

        let bingos = 0;
        let reaches = 0;

        lines.forEach((line) => {
          const checkedCount = line.filter((val) => val).length;
          if (checkedCount === 5) {
            bingos++;
          } else if (checkedCount === 4) {
            reaches++;
          }
        });

        return { bingos, reaches };
      }

      function updateCardStatus() {
        const cards = document.querySelectorAll(".player-card");
        cards.forEach((card, idx) => {
          const status = evaluateCard(card);

          const reachBadge = document.getElementById(`reachCount_${idx}`);
          const bingoBadge = document.getElementById(`bingoCount_${idx}`);

          if (reachBadge) reachBadge.innerText = `リーチ: ${status.reaches}`;
          if (bingoBadge) bingoBadge.innerText = `ビンゴ: ${status.bingos}列`;

          if (status.bingos >= 2 && !gameFinished) {
            triggerWinModal(playerNames[idx]);
          }
        });
      }

      function triggerWinModal(winnerName) {
        gameFinished = true;
        const modal = document.getElementById("winModal");
        const text = document.getElementById("winnerText");
        text.innerText = `${winnerName} さんが 2列ビンゴを達成して勝利しました！ 🎉`;
        modal.style.display = "flex";
        updateTurnDisplay();
      }

      function closeModal() {
        document.getElementById("winModal").style.display = "none";
      }

      function normalizeChar(ch) {
        const smallMap = {
          ぁ: "あ",
          ぃ: "い",
          ぅ: "う",
          ぇ: "え",
          ぉ: "お",
          っ: "つ",
          ゃ: "や",
          ゅ: "ゆ",
          ょ: "よ",
          ゎ: "わ",
        };
        return smallMap[ch] || ch;
      }

      function submitWord(event) {
        event.preventDefault();
        if (gameFinished) {
          alert(
            "ゲームは既に終了しています。「カードを新しく配り直す」を押して次のゲームを始めてください！",
          );
          return;
        }

        const inputField = document.getElementById("wordInput");
        let word = inputField.value.trim();
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.innerText = "";

        if (!word) return;

        let firstCharInput = normalizeChar(word.charAt(0));
        let lastCharInput = normalizeChar(word.slice(-1));

        if (lastCharInput === "ん") {
          errorMsg.innerText = "「ん」で終わる言葉は使えません！";
          return;
        }

        if (lastChar !== null && firstCharInput !== lastChar) {
          errorMsg.innerText = `🎵 「${lastChar}」から始まる言葉を入力してください！（入力された先頭: ${firstCharInput}）`;
          return;
        }

        const charsInWord = [...word].map((c) => normalizeChar(c));

        const cells = document.querySelectorAll(".cell");
        charsInWord.forEach((c) => {
          cells.forEach((cell) => {
            if (cell.dataset.char === c) {
              cell.classList.add("checked");
            }
          });
        });

        updateCardStatus();

        const speakerName = playerNames[currentTurnIndex];
        wordHistory.push({ name: speakerName, word: word });
        const historyList = document.getElementById("historyList");
        const li = document.createElement("li");
        li.innerText = `[${speakerName}] ${word} （使った文字: ${charsInWord.join(", ")}）`;
        historyList.appendChild(li);

        lastChar = lastCharInput;
        inputField.value = "";
        inputField.focus();

        if (!gameFinished) {
          currentTurnIndex = (currentTurnIndex + 1) % playerNames.length;
          updateTurnDisplay();
        }
      }

      window.onload = generateBoards;
    </script>
  </body>
</html>
