<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>文字ポーカー対戦</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .card {
        display: inline-block;
        width: 50px;
        height: 70px;
        margin: 5px;
        border-radius: 8px;
        line-height: 70px;
        font-size: 24px;
        font-weight: bold;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s;
      }
      .black {
        color: #333;
        border: 2px solid #333;
      }
      .blue {
        color: #0066cc;
        border: 2px solid #0066cc;
      }
      .red {
        color: #cc0000;
        border: 2px solid #cc0000;
      }
      .selected {
        transform: translateY(-10px);
        background: #fff3cd;
      }
      .used {
        opacity: 0.35;
        transform: none !important;
        cursor: default;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
      }

      #game-screen {
        display: none;
      }
      #word-section {
        display: none;
        margin-top: 10px;
      }

      #word-input-area {
        margin: 10px 0;
        padding: 10px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        display: inline-block;
      }
      #word-input-area input {
        font-size: 22px;
        padding: 6px 10px;
        width: 180px;
        text-align: center;
        border: 2px solid #aaa;
        border-radius: 6px;
        vertical-align: middle;
      }
      #word-input-area button {
        font-size: 16px;
        padding: 8px 14px;
        vertical-align: middle;
      }
      #word-list {
        margin-top: 8px;
        font-size: 16px;
        line-height: 1.8;
      }

      #result-section {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        font-size: 18px;
      }
      #result-section h2 {
        font-size: 28px;
        margin: 0 0 10px;
      }

      /* 順位表 */
      #ranking {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        font-size: 16px;
      }
      #ranking th {
        background: #555;
        color: #fff;
        padding: 6px 10px;
      }
      #ranking td {
        padding: 6px 10px;
        border-bottom: 1px solid #ddd;
      }
      #ranking tr.me {
        background: #fffde7;
        font-weight: bold;
      }
      #ranking tr.rank1 td:first-child::before {
        content: "🥇 ";
      }
      #ranking tr.rank2 td:first-child::before {
        content: "🥈 ";
      }
      #ranking tr.rank3 td:first-child::before {
        content: "🥉 ";
      }

      #rematch-area {
        margin-top: 16px;
      }
      #rematch-status {
        font-size: 15px;
        color: #888;
        margin-top: 8px;
      }

      /* ロビーの参加者リスト */
      #player-list {
        list-style: none;
        padding: 0;
        margin: 10px 0;
        font-size: 16px;
      }
      #player-list li {
        margin: 4px 0;
      }

      /* 待機メッセージ */
      #waiting-msg {
        color: #888;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <h1>文字ポーカーver1.3</h1>

    <!-- ロビー画面 -->
    <div id="lobby-screen">
      <input type="text" id="room-input" placeholder="合言葉（例: room123）" />
      <br />
      <button onclick="createRoom()">部屋を作る (ホスト)</button>
      <button onclick="joinRoom()">部屋に参加</button>
      <p id="status"></p>

      <!-- ホスト用：参加者リスト＆開始ボタン -->
      <div id="host-lobby" style="display: none">
        <p>参加者：</p>
        <ul id="player-list"></ul>
        <button id="start-btn" onclick="hostStartGame()">
          ▶ ゲームを開始する
        </button>
      </div>

      <!-- ゲスト用：待機メッセージ -->
      <p id="waiting-msg" style="display: none">
        ホストがゲームを開始するまでお待ちください…
      </p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen">
      <h2>対戦ルーム: <span id="room-id-display"></span></h2>

      <!-- カード交換フェーズ -->
      <div id="exchange-section">
        <p>あなたの手札（クリックで選択して交換）</p>
        <div id="my-hand"></div>
        <br />
        <button id="exchange-btn" onclick="exchangeCards()">
          選択したカードを交換する（1回のみ）
        </button>
        <p id="exchange-status" style="color: #888; font-size: 14px"></p>
      </div>

      <!-- 単語入力フェーズ -->
      <div id="word-section">
        <p style="font-size: 13px; color: #666; margin: 4px 0">
          手札の文字を使って単語を入力 / 同じ文字を複数回使う場合は複数枚必要
        </p>
        <p style="margin: 6px 0"><strong>あなたの手札</strong></p>
        <div id="my-hand-final"></div>
        <div id="word-input-area">
          <input
            type="text"
            id="word-input"
            placeholder="単語を入力"
            onkeydown="if (event.key === 'Enter') submitWord();"
          />
          <button onclick="submitWord()">確定</button>
          <button id="finish-btn" onclick="finishWords()">終了→結果へ</button>
        </div>
        <div id="word-list"></div>
      </div>

      <!-- 結果表示フェーズ -->
      <div id="result-section">
        <h2 id="result-label"></h2>
        <table id="ranking">
          <thead>
            <tr>
              <th>名前</th>
              <th>単語</th>
              <th>得点</th>
            </tr>
          </thead>
          <tbody id="ranking-body"></tbody>
        </table>
        <div id="rematch-area">
          <button onclick="requestRematch()">🔄 再戦する</button>
          <p id="rematch-status"></p>
        </div>
      </div>
    </div>

    <script>
      // ── 文字リスト ───────────────────────────────────────────────
      const rawList = [
        "の",
        "に",
        "た",
        "い",
        "は",
        "を",
        "と",
        "る",
        "が",
        "し",
        "で",
        "て",
        "な",
        "か",
        "れ",
        "ら",
        "も",
        "う",
        "す",
        "り",
        "こ",
        "だ",
        "ま",
        "さ",
        "き",
        "め",
        "く",
        "あ",
        "け",
        "ど",
        "ん",
        "え",
        "よ",
        "つ",
        "や",
        "そ",
        "わ",
        "ち",
        "み",
        "せ",
        "ろ",
        "ば",
        "お",
        "じ",
        "べ",
        "ず",
        "げ",
        "ほ",
        "へ",
        "び",
        "む",
        "ご",
        "ね",
        "ぶ",
        "ぐ",
        "ぎ",
        "ひ",
        "づ",
        "ぼ",
        "ざ",
        "ふ",
        "ぞ",
        "ゆ",
        "ぜ",
        "ぬ",
        "ぱ",
        "ぴ",
        "ぽ",
        "ぷ",
        "ぺ",
        "ぢ",
        "ー",
      ];

      // ── 状態変数 ─────────────────────────────────────────────────
      let deck = [];
      let myHand = [];
      let myName = "";
      let hasExchanged = false;
      let myWords = [];
      let myTotalScore = 0;
      let iFinished = false;
      let iWantRematch = false;

      // マルチプレイヤー管理
      // ホスト：conns = { peerId: { conn, name, exchanged, score, detail } }
      // ゲスト：hostConn = conn to host
      let isHost = false;
      let conns = {}; // ホスト用：接続中のゲスト
      let hostConn = null; // ゲスト用：ホストへの接続
      let playerCount = 0; // ホスト用：ゲーム開始時の参加人数（自分含む）
      let exchangeDoneCount = 0;
      let scoreDoneCount = 0;
      let rematchCount = 0;
      let peer;
      let roomName = "";

      // ── デッキ初期化 ─────────────────────────────────────────────
      function initDeck() {
        deck = [];
        rawList.forEach((char, index) => {
          let count, color, score;
          if (index < 15) {
            count = 3;
            color = "black";
            score = 1;
          } else if (index < 35) {
            count = 2;
            color = "blue";
            score = 2;
          } else {
            count = 1;
            color = "red";
            score = 3;
          }
          for (let i = 0; i < count; i++) deck.push({ char, color, score });
        });
        deck.sort(() => Math.random() - 0.5);
      }

      // ── カードをN枚デッキから引く ────────────────────────────────
      function dealCards(n) {
        if (deck.length >= n) return deck.splice(0, n);
        // デッキ不足時はランダム補充
        const result = [];
        for (let i = 0; i < n; i++) result.push(drawRandom());
        return result;
      }

      function drawRandom() {
        const pool = [];
        rawList.forEach((char, index) => {
          let count, color, score;
          if (index < 15) {
            count = 3;
            color = "black";
            score = 1;
          } else if (index < 35) {
            count = 2;
            color = "blue";
            score = 2;
          } else {
            count = 1;
            color = "red";
            score = 3;
          }
          for (let i = 0; i < count; i++) pool.push({ char, color, score });
        });
        return pool[Math.floor(Math.random() * pool.length)];
      }

      // ── ゲーム状態リセット ───────────────────────────────────────
      function resetGameState() {
        deck = [];
        myHand = [];
        hasExchanged = false;
        myWords = [];
        myTotalScore = 0;
        iFinished = false;
        iWantRematch = false;
        exchangeDoneCount = 0;
        scoreDoneCount = 0;
        rematchCount = 0;

        // ゲストの状態もリセット
        Object.values(conns).forEach((g) => {
          g.exchanged = false;
          g.score = null;
          g.detail = null;
          g.wantsRematch = false;
        });

        // UI リセット
        document.getElementById("result-section").style.display = "none";
        document.getElementById("word-section").style.display = "none";
        document.getElementById("exchange-section").style.display = "block";
        document.getElementById("exchange-btn").disabled = false;
        document.getElementById("exchange-status").innerText = "";
        document.getElementById("word-list").innerHTML = "";
        document.getElementById("word-input").value = "";
        document.getElementById("word-input").disabled = false;
        document.getElementById("finish-btn").disabled = false;
        document.getElementById("rematch-status").innerText = "";
        document.querySelector("#rematch-area button").disabled = false;
        document.getElementById("my-hand").innerHTML = "";
        document.getElementById("my-hand-final").innerHTML = "";
      }

      // ── 部屋作成（ホスト） ───────────────────────────────────────
      function createRoom() {
        roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        myName = prompt("あなたの名前を入力してください", "ホスト") || "ホスト";
        isHost = true;

        peer = new Peer("wordpoker-" + roomName);
        peer.on("open", () => {
          document.getElementById("status").innerText =
            `部屋「${roomName}」を作りました`;
          document.getElementById("host-lobby").style.display = "block";
          updatePlayerList();
        });

        // ゲストが接続してきたら登録
        peer.on("connection", (c) => {
          const guestId = c.peer;
          conns[guestId] = {
            conn: c,
            name: "接続中...",
            exchanged: false,
            score: null,
            detail: null,
            wantsRematch: false,
          };
          c.on("open", () => {
            // 名前を要求
            c.send({ type: "ASK_NAME" });
          });
          c.on("data", (data) => hostReceive(guestId, data));
          c.on("close", () => {
            delete conns[guestId];
            updatePlayerList();
          });
        });
      }

      // ── 参加者リスト更新（ホスト用） ────────────────────────────
      function updatePlayerList() {
        const ul = document.getElementById("player-list");
        ul.innerHTML = `<li>👑 ${myName}（あなた・ホスト）</li>`;
        Object.values(conns).forEach((g) => {
          ul.innerHTML += `<li>👤 ${g.name}</li>`;
        });
      }

      // ── 部屋参加（ゲスト） ───────────────────────────────────────
      function joinRoom() {
        roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        myName =
          prompt("あなたの名前を入力してください", "プレイヤー") ||
          "プレイヤー";
        isHost = false;

        peer = new Peer();
        peer.on("open", () => {
          hostConn = peer.connect("wordpoker-" + roomName);
          hostConn.on("open", () => {
            document.getElementById("status").innerText =
              `部屋「${roomName}」に参加しました`;
            document.getElementById("waiting-msg").style.display = "block";
          });
          hostConn.on("data", (data) => guestReceive(data));
        });
      }

      // ── ホスト：ゲストからのデータ受信 ──────────────────────────
      function hostReceive(guestId, data) {
        const guest = conns[guestId];
        if (!guest) return;

        if (data.type === "MY_NAME") {
          guest.name = data.name;
          updatePlayerList();
          // 全ゲストに参加者リストを通知
          broadcastPlayerList();
        } else if (data.type === "EXCHANGE_DONE") {
          guest.exchanged = true;
          exchangeDoneCount++;
          updateExchangeStatus();
          checkAllExchanged();
        } else if (data.type === "SCORE") {
          guest.score = data.total;
          guest.detail = data.detail;
          scoreDoneCount++;
          checkAllScored();
        } else if (data.type === "REMATCH_REQUEST") {
          guest.wantsRematch = true;
          rematchCount++;
          checkAllRematch();
        }
      }

      // ── ゲスト：ホストからのデータ受信 ──────────────────────────
      function guestReceive(data) {
        if (data.type === "ASK_NAME") {
          hostConn.send({ type: "MY_NAME", name: myName });
        } else if (data.type === "PLAYER_LIST") {
          // 参加者リストを受け取って表示（ゲスト用ロビー）
          const names = data.names;
          document.getElementById("status").innerText =
            `参加者：${names.join("、")}`;
        } else if (data.type === "HAND") {
          // ゲーム開始：手札を受け取る
          document.getElementById("lobby-screen").style.display = "none";
          document.getElementById("game-screen").style.display = "block";
          document.getElementById("room-id-display").innerText = roomName;
          myHand = data.hand;
          renderHand();
        } else if (data.type === "ALL_EXCHANGED") {
          // 全員交換完了 → 単語入力フェーズへ
          document.getElementById("exchange-section").style.display = "none";
          document.getElementById("word-section").style.display = "block";
          renderHandFinal();
          document.getElementById("word-input").focus();
        } else if (data.type === "RESULT") {
          // 結果を受け取って表示
          showResult(data.ranking);
        } else if (data.type === "REMATCH_START") {
          // 再戦開始
          resetGameState();
          myHand = data.hand;
          renderHand();
        }
      }

      // ── ホスト：全ゲストに送信 ───────────────────────────────────
      function broadcast(msg) {
        Object.values(conns).forEach((g) => g.conn.send(msg));
      }

      // ── ホスト：参加者名リストを全ゲストに通知 ──────────────────
      function broadcastPlayerList() {
        const names = [myName, ...Object.values(conns).map((g) => g.name)];
        broadcast({ type: "PLAYER_LIST", names });
      }

      // ── ホスト：ゲームを開始する ─────────────────────────────────
      function hostStartGame() {
        const guestList = Object.values(conns);
        if (guestList.length === 0) {
          if (!confirm("参加者があなただけですが開始しますか？")) return;
        }
        playerCount = 1 + guestList.length; // ホスト含む
        exchangeDoneCount = 0;
        scoreDoneCount = 0;

        // ゲーム画面へ
        document.getElementById("lobby-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("room-id-display").innerText = roomName;

        initDeck();
        myHand = dealCards(7);
        renderHand();

        // 各ゲストに手札を配る
        guestList.forEach((g) => {
          g.conn.send({ type: "HAND", hand: dealCards(7) });
        });
      }

      // ── 手札表示（交換フェーズ） ─────────────────────────────────
      function renderHand() {
        const container = document.getElementById("my-hand");
        container.innerHTML = "";
        myHand.forEach((card, index) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}`;
          div.innerText = card.char;
          div.onclick = () => div.classList.toggle("selected");
          div.dataset.index = index;
          container.appendChild(div);
        });
      }

      // ── 手札表示（単語入力フェーズ） ────────────────────────────
      function renderHandFinal() {
        const container = document.getElementById("my-hand-final");
        container.innerHTML = "";
        myHand.forEach((card) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}` + (card.used ? " used" : "");
          div.innerText = card.char;
          container.appendChild(div);
        });
      }

      // ── カード交換 ───────────────────────────────────────────────
      function exchangeCards() {
        if (hasExchanged) return alert("交換は1回までです！");

        const selectedDivs = document.querySelectorAll("#my-hand .selected");
        const indicesToReplace = Array.from(selectedDivs).map((div) =>
          parseInt(div.dataset.index),
        );

        if (indicesToReplace.length === 0) {
          if (!confirm("1枚も交換しませんか？")) return;
        }

        indicesToReplace.forEach((index) => {
          myHand[index] = drawRandom();
        });
        hasExchanged = true;
        document.getElementById("exchange-btn").disabled = true;
        renderHand();

        if (isHost) {
          exchangeDoneCount++;
          updateExchangeStatus();
          checkAllExchanged();
        } else {
          hostConn.send({ type: "EXCHANGE_DONE" });
          document.getElementById("exchange-status").innerText =
            "交換完了。全員が終わるまでお待ちください…";
        }
      }

      // ── 交換完了人数を表示（ホスト用） ──────────────────────────
      function updateExchangeStatus() {
        document.getElementById("exchange-status").innerText =
          `交換完了 ${exchangeDoneCount} / ${playerCount} 人`;
      }

      // ── 全員が交換完了したら単語入力フェーズへ（ホスト用） ──────
      function checkAllExchanged() {
        if (exchangeDoneCount < playerCount) return;
        // 全ゲストに通知
        broadcast({ type: "ALL_EXCHANGED" });
        // ホスト自身も移行
        document.getElementById("exchange-section").style.display = "none";
        document.getElementById("word-section").style.display = "block";
        renderHandFinal();
        document.getElementById("word-input").focus();
      }

      // ── 単語確定 ─────────────────────────────────────────────────
      function submitWord() {
        const input = document.getElementById("word-input");
        const word = input.value.trim();
        if (!word) return;
        input.value = "";

        const handCopy = myHand.map((c) => ({ ...c }));
        let score = 0;
        let valid = true;
        const usedIndices = [];

        for (const ch of word) {
          const idx = handCopy.findIndex(
            (c) => c.char === ch && !c._tmpUsed && !c.used,
          );
          if (idx === -1) {
            valid = false;
            break;
          }
          handCopy[idx]._tmpUsed = true;
          score += handCopy[idx].score;
          usedIndices.push(idx);
        }

        if (!valid) {
          alert(`「${word}」は手札にない文字が含まれています。`);
          input.focus();
          return;
        }

        usedIndices.forEach((i) => {
          myHand[i].used = true;
        });
        myTotalScore += score;
        myWords.push({ word, score });

        renderHandFinal();
        updateWordList();
        input.focus();

        if (myHand.filter((c) => !c.used).length === 0) {
          alert("手札をすべて使いました！");
          finishWords();
        }
      }

      // ── 単語リスト表示 ───────────────────────────────────────────
      function updateWordList() {
        document.getElementById("word-list").innerHTML = myWords
          .map((w) => `✅ <strong>${w.word}</strong>：${w.score}点`)
          .join("<br>");
      }

      // ── 単語入力終了 ─────────────────────────────────────────────
      function finishWords() {
        if (iFinished) return;
        iFinished = true;
        document.getElementById("word-input").disabled = true;
        document.getElementById("finish-btn").disabled = true;

        const detail =
          myWords.map((w) => `${w.word}(${w.score}点)`).join("、") ||
          "単語なし";

        if (isHost) {
          scoreDoneCount++;
          checkAllScored();
        } else {
          hostConn.send({ type: "SCORE", total: myTotalScore, detail });
        }
      }

      // ── 全員得点提出完了（ホスト用） ────────────────────────────
      function checkAllScored() {
        if (scoreDoneCount < playerCount) return;

        // 順位表を作成
        const myDetail =
          myWords.map((w) => `${w.word}(${w.score}点)`).join("、") ||
          "単語なし";
        const allScores = [
          { name: myName, total: myTotalScore, detail: myDetail },
          ...Object.values(conns).map((g) => ({
            name: g.name,
            total: g.score ?? 0,
            detail: g.detail || "単語なし",
          })),
        ];
        allScores.sort((a, b) => b.total - a.total);

        // 全員に結果を送信
        broadcast({ type: "RESULT", ranking: allScores });
        // ホスト自身も表示
        showResult(allScores);
      }

      // ── 結果表示 ─────────────────────────────────────────────────
      function showResult(ranking) {
        document.getElementById("word-section").style.display = "none";
        document.getElementById("exchange-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";

        const tbody = document.getElementById("ranking-body");
        tbody.innerHTML = "";
        ranking.forEach((p, i) => {
          const tr = document.createElement("tr");
          const rankClass = ["rank1", "rank2", "rank3"][i] || "";
          const isMe = p.name === myName;
          tr.className = (rankClass + (isMe ? " me" : "")).trim();
          tr.innerHTML = `<td>${p.name}</td><td style="font-size:13px">${p.detail}</td><td>${p.total}点</td>`;
          tbody.appendChild(tr);
        });

        const label = document.getElementById("result-label");
        const myRank = ranking.findIndex((p) => p.name === myName) + 1;
        if (
          myRank === 1 &&
          ranking.filter((p) => p.total === ranking[0].total).length === 1
        ) {
          label.textContent = "🎉 あなたの勝ち！";
          label.style.color = "#cc0000";
        } else if (
          myRank === ranking.length &&
          ranking.filter((p) => p.total === ranking[ranking.length - 1].total)
            .length === 1
        ) {
          label.textContent = "😢 最下位…";
          label.style.color = "#0066cc";
        } else {
          label.textContent = `あなたは ${myRank} 位`;
          label.style.color = "#333";
        }
      }

      // ── 再戦リクエスト ───────────────────────────────────────────
      function requestRematch() {
        iWantRematch = true;
        document.querySelector("#rematch-area button").disabled = true;
        document.getElementById("rematch-status").innerText =
          "再戦リクエストを送りました。全員が揃うまで待っています…";

        if (isHost) {
          rematchCount++;
          checkAllRematch();
        } else {
          hostConn.send({ type: "REMATCH_REQUEST" });
        }
      }

      // ── 全員再戦希望で再開（ホスト用） ──────────────────────────
      function checkAllRematch() {
        const waiting = playerCount - rematchCount;
        if (waiting > 0) {
          document.getElementById("rematch-status").innerText =
            `再戦待ち：あと ${waiting} 人`;
          return;
        }
        // 全員揃った：ホストがリセットして新しい手札を配る
        resetGameState();
        initDeck();
        myHand = dealCards(7);
        renderHand();

        Object.values(conns).forEach((g) => {
          g.conn.send({ type: "REMATCH_START", hand: dealCards(7) });
        });
      }
    </script>
  </body>
</html>
