<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>文字ポーカー</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .card {
        display: inline-block;
        width: 50px;
        height: 70px;
        margin: 5px;
        border-radius: 8px;
        line-height: 70px;
        font-size: 24px;
        font-weight: bold;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s;
      }
      .black {
        color: #333;
        border: 2px solid #333;
      }
      .blue {
        color: #0066cc;
        border: 2px solid #0066cc;
      }
      .red {
        color: #cc0000;
        border: 2px solid #cc0000;
      }
      .selected {
        transform: translateY(-10px);
        background: #fff3cd;
      }
      .used {
        opacity: 0.35;
        transform: none !important;
        cursor: default;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
      }

      /* 言語選択ボタン */
      .lang-btn {
        font-size: 22px;
        padding: 14px 28px;
        border-radius: 10px;
        border: 3px solid #ccc;
        background: #fff;
        cursor: pointer;
        margin: 8px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .lang-btn.active {
        border-color: #0066cc;
        background: #e8f0fe;
      }
      #lang-section {
        margin-bottom: 16px;
      }

      #game-screen {
        display: none;
      }
      #word-section {
        display: none;
        margin-top: 10px;
      }

      #word-input-area {
        margin: 10px 0;
        padding: 10px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        display: inline-block;
      }
      #word-input-area input {
        font-size: 22px;
        padding: 6px 10px;
        width: 180px;
        text-align: center;
        border: 2px solid #aaa;
        border-radius: 6px;
        vertical-align: middle;
      }
      #word-input-area button {
        font-size: 16px;
        padding: 8px 14px;
        vertical-align: middle;
      }

      #loading-msg {
        display: none;
        font-size: 15px;
        color: #888;
        margin: 6px 0;
      }

      #word-list {
        margin-top: 8px;
        font-size: 16px;
        line-height: 1.8;
      }

      #result-section {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        font-size: 18px;
      }
      #result-section h2 {
        font-size: 28px;
        margin: 0 0 10px;
      }

      #ranking {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        font-size: 16px;
      }
      #ranking th {
        background: #555;
        color: #fff;
        padding: 6px 10px;
      }
      #ranking td {
        padding: 6px 10px;
        border-bottom: 1px solid #ddd;
      }
      #ranking tr.me {
        background: #fffde7;
        font-weight: bold;
      }
      #ranking tr.rank1 td:first-child::before {
        content: "🥇 ";
      }
      #ranking tr.rank2 td:first-child::before {
        content: "🥈 ";
      }
      #ranking tr.rank3 td:first-child::before {
        content: "🥉 ";
      }

      #rematch-area {
        margin-top: 16px;
      }
      #rematch-status {
        font-size: 15px;
        color: #888;
        margin-top: 8px;
      }

      #player-list {
        list-style: none;
        padding: 0;
        margin: 10px 0;
        font-size: 16px;
      }
      #player-list li {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <h1 id="page-title">文字ポーカーver1.4</h1>

    <!-- ロビー画面 -->
    <div id="lobby-screen">
      <!-- 言語選択（ホストのみ選べる、ゲストはホストに合わせる） -->
      <div id="lang-section">
        <p style="margin: 4px 0; font-size: 14px; color: #666">
          題材を選ぶ（ホストのみ）
        </p>
        <button class="lang-btn active" id="btn-ja" onclick="selectLang('ja')">
          🇯🇵 日本語
        </button>
        <button class="lang-btn" id="btn-en" onclick="selectLang('en')">
          🇬🇧 英語
        </button>
      </div>

      <input type="text" id="room-input" placeholder="合言葉（例: room123）" />
      <br />
      <button onclick="createRoom()">部屋を作る（ホスト）</button>
      <button onclick="joinRoom()">部屋に参加</button>
      <p id="status"></p>

      <!-- ホスト用 -->
      <div id="host-lobby" style="display: none">
        <p id="players-label">参加者：</p>
        <ul id="player-list"></ul>
        <button id="start-btn" onclick="hostStartGame()">
          ▶ ゲームを開始する
        </button>
      </div>

      <!-- ゲスト用 -->
      <p id="waiting-msg" style="display: none; color: #888">
        ホストがゲームを開始するまでお待ちください…
      </p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen">
      <h2><span id="room-id-display"></span></h2>

      <!-- カード交換フェーズ -->
      <div id="exchange-section">
        <p id="exchange-hint"></p>
        <div id="my-hand"></div>
        <br />
        <button
          id="exchange-btn"
          onclick="exchangeCards()"
          id="exchange-btn"
        ></button>
        <p id="exchange-status" style="color: #888; font-size: 14px"></p>
      </div>

      <!-- 単語入力フェーズ -->
      <div id="word-section">
        <p
          id="word-hint"
          style="font-size: 13px; color: #666; margin: 4px 0"
        ></p>
        <p style="margin: 6px 0"><strong id="hand-label"></strong></p>
        <div id="my-hand-final"></div>
        <div id="word-input-area">
          <input
            type="text"
            id="word-input"
            onkeydown="if (event.key === 'Enter' && !event.isComposing) submitWord();"
          />
          <button id="submit-btn" onclick="submitWord()"></button>
          <button id="finish-btn" onclick="finishWords()"></button>
        </div>
        <p id="loading-msg">⏳ Checking dictionary…</p>
        <div id="word-list"></div>
      </div>

      <!-- 結果表示フェーズ -->
      <div id="result-section">
        <h2 id="result-label"></h2>
        <table id="ranking">
          <thead>
            <tr>
              <th id="col-name"></th>
              <th id="col-words"></th>
              <th id="col-score"></th>
            </tr>
          </thead>
          <tbody id="ranking-body"></tbody>
        </table>
        <div id="rematch-area">
          <button id="rematch-btn" onclick="requestRematch()"></button>
          <p id="rematch-status"></p>
        </div>
      </div>
    </div>

    <script>
      // ══════════════════════════════════════════════════════════════
      // 言語定義
      // ══════════════════════════════════════════════════════════════
      const LANG_DATA = {
        ja: {
          // カードリスト（index 0-14: 黒1点×3, 15-34: 青2点×2, 35-: 赤3点×1）
          chars: [
            "の",
            "に",
            "た",

            "は",
            "を",
            "と",
            "る",
            "が",
            "し",
            "で",
            "て",
            "な",
            "か",
            "れ",
            "ら",
            "も",
            "う",
            "す",
            "り",
            "こ",
            "だ",
            "ま",
            "さ",
            "き",
            "め",
            "く",
            "あ",
            "け",
            "ど",
            "ん",
            "え",
            "よ",
            "つ",
            "や",
            "そ",
            "わ",
            "ち",
            "み",
            "せ",
            "ろ",
            "ば",
            "お",
            "じ",
            "べ",
            "ず",
            "げ",
            "ほ",
            "へ",
            "び",
            "む",
            "ご",
            "ね",
            "ぶ",
            "ぐ",
            "ぎ",
            "ひ",
            "づ",
            "ぼ",
            "ざ",
            "ふ",
            "ぞ",
            "ゆ",
            "ぜ",
            "ぬ",
            "ぱ",
            "ぴ",
            "ぽ",
            "ぷ",
            "ぺ",
            "ぢ",
            "ー",
          ],
          blackEnd: 15,
          blueEnd: 35,
          checkWord: null, // 判定なし（自己申告）
          ui: {
            title: "文字ポーカー",
            roomLabel: (r) => `対戦ルーム: ${r}`,
            exchangeHint: "あなたの手札（クリックで選択して交換）",
            exchangeBtn: "選択したカードを交換する（1回のみ）",
            exchangeWait: "交換完了。全員が終わるまでお待ちください…",
            exchangeCount: (d, t) => `交換完了 ${d} / ${t} 人`,
            wordHint:
              "手札の文字を使って単語を入力 / 同じ文字を複数回使う場合は複数枚必要",
            handLabel: "あなたの手札",
            wordPlaceholder: "単語を入力",
            submitBtn: "確定",
            finishBtn: "終了→結果へ",
            wordRow: (w, s) => `✅ <strong>${w}</strong>：${s}点`,
            noWord: "単語なし",
            scoreUnit: "点",
            colName: "名前",
            colWords: "単語",
            colScore: "得点",
            rematchBtn: "🔄 再戦する",
            rematchWait:
              "再戦リクエストを送りました。全員が揃うまで待っています…",
            rematchCount: (n) => `再戦待ち：あと ${n} 人`,
            win: "🎉 あなたの勝ち！",
            last: "😢 最下位…",
            rank: (n) => `あなたは ${n} 位`,
            allUsed: "手札をすべて使いました！",
            invalidCard: (w) => `「${w}」は手札にない文字が含まれています。`,
            invalidWord: null, // 判定なし
            confirmNoExchange: "1枚も交換しませんか？",
            confirmOnlyYou: "参加者があなただけですが開始しますか？",
            namePromptDefault: "ホスト",
            namePromptGuest: "プレイヤー",
            playersLabel: "参加者：",
            waitingMsg: "ホストがゲームを開始するまでお待ちください…",
            statusCreated: (r) => `部屋「${r}」を作りました`,
            statusJoined: (r) => `部屋「${r}」に参加しました`,
            statusPlayers: (names) => `参加者：${names.join("、")}`,
          },
        },

        en: {
          // カードリスト（index 0-8: 黒1点×3, 9-19: 青2点×2, 20-: 赤3点×1）
          chars: [
            "E",
            "T",
            "A",
            "O",
            "I",
            "N",
            "S",
            "H",
            "R", // 黒
            "D",
            "L",
            "C",
            "U",
            "M",
            "W",
            "F",
            "G",
            "Y",
            "P",
            "B", // 青
            "V",
            "K",
            "J",
            "X",
            "Q",
            "Z", // 赤
          ],
          blackEnd: 9,
          blueEnd: 20,
          checkWord: async (word) => {
            try {
              const res = await fetch(
                `https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`,
              );
              return res.ok;
            } catch {
              return true;
            }
          },
          ui: {
            title: "文字ポーカー",
            roomLabel: (r) => `対戦ルーム: ${r}`,
            exchangeHint: "あなたの手札（クリックで選択して交換）",
            exchangeBtn: "選択したカードを交換する（1回のみ）",
            exchangeWait: "交換完了。全員が終わるまでお待ちください…",
            exchangeCount: (d, t) => `交換完了 ${d} / ${t} 人`,
            wordHint: "手札の文字を使って単語を入力 / 同じ文字を複数回使う場合は複数枚必要",
            handLabel: "あなたの手札",
            wordPlaceholder: "単語を入力",
            submitBtn: "確定",
            finishBtn: "終了→結果へ",
            wordRow: (w, s) => `✅ <strong>${w}</strong>: ${s}点`,
            noWord: "単語なし",
            scoreUnit: "点",
            colName: "名前",
            colWords: "単語",
            colScore: "得点",
            rematchBtn: "🔄 再戦する",
            rematchWait: "再戦リクエストを送りました。全員が揃うまで待っています…",
            rematchCount: (n) => `再戦待ち：あと ${n} 人`,
            win: "🎉 あなたの勝ち！",
            last: "😢 最下位…",
            rank: (n) => `あなたは ${n} 位`,
            allUsed: "手札をすべて使いました！",
            invalidCard: (w) => `「${w}」は手札にない文字が含まれています。`,
            invalidWord: (w) => `「${w}」は辞書に見つかりませんでした。`,
            confirmNoExchange: "1枚も交換しませんか？",
            confirmOnlyYou: "参加者があなただけですが開始しますか？",
            namePromptDefault: "ホスト",
            namePromptGuest: "プレイヤー",
            playersLabel: "参加者：",
            waitingMsg: "ホストがゲームを開始するまでお待ちください…",
            statusCreated: (r) => `部屋「${r}」を作りました`,
            statusJoined: (r) => `部屋「${r}」に参加しました`,
            statusPlayers: (names) => `参加者：${names.join("、")}`,
          },
        },
      };

      // ══════════════════════════════════════════════════════════════
      // 状態変数
      // ══════════════════════════════════════════════════════════════
      let lang = "ja"; // 選択中の言語（ホストが決定）
      let L = LANG_DATA.ja; // 現在の言語データへの参照

      let deck = [];
      let myHand = [];
      let myName = "";
      let hasExchanged = false;
      let myWords = [];
      let myTotalScore = 0;
      let iFinished = false;
      let iWantRematch = false;

      let isHost = false;
      let conns = {};
      let hostConn = null;
      let playerCount = 0;
      let exchangeDoneCount = 0;
      let scoreDoneCount = 0;
      let rematchCount = 0;
      let peer;
      let roomName = "";

      // ══════════════════════════════════════════════════════════════
      // 言語選択（ホスト用）
      // ══════════════════════════════════════════════════════════════
      function selectLang(l) {
        lang = l;
        L = LANG_DATA[l];
        document
          .getElementById("btn-ja")
          .classList.toggle("active", l === "ja");
        document
          .getElementById("btn-en")
          .classList.toggle("active", l === "en");
      }

      // ゲームUIのテキストを現在の言語で更新
      function applyLangUI() {
        document.getElementById("page-title").textContent = L.ui.title;
        document.getElementById("exchange-hint").textContent =
          L.ui.exchangeHint;
        document.getElementById("exchange-btn").textContent = L.ui.exchangeBtn;
        document.getElementById("word-hint").textContent = L.ui.wordHint;
        document.getElementById("hand-label").textContent = L.ui.handLabel;
        document.getElementById("word-input").placeholder =
          L.ui.wordPlaceholder;
        // 英語版は大文字入力（submitWord内で変換するのでリアルタイム書き換えは不要）
        document.getElementById("word-input").oninput = null;
        document.getElementById("submit-btn").textContent = L.ui.submitBtn;
        document.getElementById("finish-btn").textContent = L.ui.finishBtn;
        document.getElementById("col-name").textContent = L.ui.colName;
        document.getElementById("col-words").textContent = L.ui.colWords;
        document.getElementById("col-score").textContent = L.ui.colScore;
        document.getElementById("rematch-btn").textContent = L.ui.rematchBtn;
        document.getElementById("waiting-msg").textContent = L.ui.waitingMsg;
        document.getElementById("players-label").textContent =
          L.ui.playersLabel;
      }

      // ══════════════════════════════════════════════════════════════
      // デッキ管理
      // ══════════════════════════════════════════════════════════════
      function cardProps(index) {
        if (index < L.blackEnd) return { count: 3, color: "black", score: 1 };
        if (index < L.blueEnd) return { count: 2, color: "blue", score: 2 };
        return { count: 1, color: "red", score: 3 };
      }

      function initDeck() {
        deck = [];
        L.chars.forEach((char, index) => {
          const { count, color, score } = cardProps(index);
          for (let i = 0; i < count; i++) deck.push({ char, color, score });
        });
        deck.sort(() => Math.random() - 0.5);
      }

      function dealCards(n) {
        if (deck.length >= n) return deck.splice(0, n);
        const result = [];
        for (let i = 0; i < n; i++) result.push(drawRandom());
        return result;
      }

      function drawRandom() {
        const pool = [];
        L.chars.forEach((char, index) => {
          const { count, color, score } = cardProps(index);
          for (let i = 0; i < count; i++) pool.push({ char, color, score });
        });
        return pool[Math.floor(Math.random() * pool.length)];
      }

      // ══════════════════════════════════════════════════════════════
      // ゲーム状態リセット
      // ══════════════════════════════════════════════════════════════
      function resetGameState() {
        deck = [];
        myHand = [];
        hasExchanged = false;
        myWords = [];
        myTotalScore = 0;
        iFinished = false;
        iWantRematch = false;
        exchangeDoneCount = 0;
        scoreDoneCount = 0;
        rematchCount = 0;

        Object.values(conns).forEach((g) => {
          g.exchanged = false;
          g.score = null;
          g.detail = null;
          g.wantsRematch = false;
        });

        document.getElementById("result-section").style.display = "none";
        document.getElementById("word-section").style.display = "none";
        document.getElementById("exchange-section").style.display = "block";
        document.getElementById("exchange-btn").disabled = false;
        document.getElementById("exchange-status").innerText = "";
        document.getElementById("word-list").innerHTML = "";
        document.getElementById("word-input").value = "";
        document.getElementById("word-input").disabled = false;
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("finish-btn").disabled = false;
        document.getElementById("loading-msg").style.display = "none";
        document.getElementById("rematch-status").innerText = "";
        document.querySelector("#rematch-area button").disabled = false;
        document.getElementById("my-hand").innerHTML = "";
        document.getElementById("my-hand-final").innerHTML = "";
      }

      // ══════════════════════════════════════════════════════════════
      // 接続
      // ══════════════════════════════════════════════════════════════
      function createRoom() {
        roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        myName =
          prompt("名前を入力してください", L.ui.namePromptDefault) ||
          L.ui.namePromptDefault;
        isHost = true;
        // 言語選択UIを非表示に
        document.getElementById("lang-section").style.display = "none";

        peer = new Peer("wordpoker-" + roomName);
        peer.on("open", () => {
          document.getElementById("status").innerText =
            L.ui.statusCreated(roomName);
          document.getElementById("host-lobby").style.display = "block";
          updatePlayerList();
        });
        peer.on("connection", (c) => {
          const guestId = c.peer;
          conns[guestId] = {
            conn: c,
            name: "…",
            exchanged: false,
            score: null,
            detail: null,
            wantsRematch: false,
          };
          c.on("open", () => c.send({ type: "ASK_NAME", lang })); // 言語も伝える
          c.on("data", (data) => hostReceive(guestId, data));
          c.on("close", () => {
            delete conns[guestId];
            updatePlayerList();
          });
        });
      }

      function updatePlayerList() {
        const ul = document.getElementById("player-list");
        ul.innerHTML = `<li>👑 ${myName}</li>`;
        Object.values(conns).forEach((g) => {
          ul.innerHTML += `<li>👤 ${g.name}</li>`;
        });
      }

      function joinRoom() {
        roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        // ゲストは言語未定（ホストから受け取る）
        myName = prompt("名前を入力してください", "プレイヤー") || "プレイヤー";
        isHost = false;
        document.getElementById("lang-section").style.display = "none";

        peer = new Peer();
        peer.on("open", () => {
          hostConn = peer.connect("wordpoker-" + roomName);
          hostConn.on("open", () => {
            document.getElementById("status").innerText =
              `部屋「${roomName}」に参加しました`;
            document.getElementById("waiting-msg").style.display = "block";
          });
          hostConn.on("data", (data) => guestReceive(data));
        });
      }

      // ══════════════════════════════════════════════════════════════
      // 通信ハンドラ
      // ══════════════════════════════════════════════════════════════
      function hostReceive(guestId, data) {
        const guest = conns[guestId];
        if (!guest) return;

        if (data.type === "MY_NAME") {
          guest.name = data.name;
          updatePlayerList();
          broadcastPlayerList();
        } else if (data.type === "EXCHANGE_DONE") {
          guest.exchanged = true;
          exchangeDoneCount++;
          updateExchangeStatus();
          checkAllExchanged();
        } else if (data.type === "SCORE") {
          guest.score = data.total;
          guest.detail = data.detail;
          scoreDoneCount++;
          checkAllScored();
        } else if (data.type === "REMATCH_REQUEST") {
          guest.wantsRematch = true;
          rematchCount++;
          checkAllRematch();
        }
      }

      function guestReceive(data) {
        if (data.type === "ASK_NAME") {
          // ホストから言語情報を受け取る
          lang = data.lang;
          L = LANG_DATA[lang];
          applyLangUI();
          hostConn.send({ type: "MY_NAME", name: myName });
        } else if (data.type === "PLAYER_LIST") {
          document.getElementById("status").innerText = L.ui.statusPlayers(
            data.names,
          );
        } else if (data.type === "HAND") {
          document.getElementById("lobby-screen").style.display = "none";
          document.getElementById("game-screen").style.display = "block";
          document.getElementById("room-id-display").innerText =
            L.ui.roomLabel(roomName);
          myHand = data.hand;
          renderHand();
        } else if (data.type === "ALL_EXCHANGED") {
          document.getElementById("exchange-section").style.display = "none";
          document.getElementById("word-section").style.display = "block";
          renderHandFinal();
          document.getElementById("word-input").focus();
        } else if (data.type === "RESULT") {
          showResult(data.ranking);
        } else if (data.type === "REMATCH_START") {
          resetGameState();
          myHand = data.hand;
          renderHand();
        }
      }

      function broadcast(msg) {
        Object.values(conns).forEach((g) => g.conn.send(msg));
      }

      function broadcastPlayerList() {
        const names = [myName, ...Object.values(conns).map((g) => g.name)];
        broadcast({ type: "PLAYER_LIST", names });
      }

      // ══════════════════════════════════════════════════════════════
      // ゲーム進行
      // ══════════════════════════════════════════════════════════════
      function hostStartGame() {
        const guestList = Object.values(conns);
        if (guestList.length === 0) {
          if (!confirm(L.ui.confirmOnlyYou)) return;
        }
        playerCount = 1 + guestList.length;
        exchangeDoneCount = 0;
        scoreDoneCount = 0;

        applyLangUI();

        document.getElementById("lobby-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("room-id-display").innerText =
          L.ui.roomLabel(roomName);

        initDeck();
        myHand = dealCards(7);
        renderHand();
        guestList.forEach((g) =>
          g.conn.send({ type: "HAND", hand: dealCards(7) }),
        );
      }

      function renderHand() {
        const container = document.getElementById("my-hand");
        container.innerHTML = "";
        myHand.forEach((card, index) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}`;
          div.innerText = card.char;
          div.onclick = () => div.classList.toggle("selected");
          div.dataset.index = index;
          container.appendChild(div);
        });
      }

      function renderHandFinal() {
        const container = document.getElementById("my-hand-final");
        container.innerHTML = "";
        myHand.forEach((card) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}` + (card.used ? " used" : "");
          div.innerText = card.char;
          container.appendChild(div);
        });
      }

      function exchangeCards() {
        if (hasExchanged) return;

        const selectedDivs = document.querySelectorAll("#my-hand .selected");
        const indicesToReplace = Array.from(selectedDivs).map((div) =>
          parseInt(div.dataset.index),
        );

        if (indicesToReplace.length === 0) {
          if (!confirm(L.ui.confirmNoExchange)) return;
        }

        indicesToReplace.forEach((index) => {
          myHand[index] = drawRandom();
        });
        hasExchanged = true;
        document.getElementById("exchange-btn").disabled = true;
        renderHand();

        if (isHost) {
          exchangeDoneCount++;
          updateExchangeStatus();
          checkAllExchanged();
        } else {
          hostConn.send({ type: "EXCHANGE_DONE" });
          document.getElementById("exchange-status").innerText =
            L.ui.exchangeWait;
        }
      }

      function updateExchangeStatus() {
        document.getElementById("exchange-status").innerText =
          L.ui.exchangeCount(exchangeDoneCount, playerCount);
      }

      function checkAllExchanged() {
        if (exchangeDoneCount < playerCount) return;
        broadcast({ type: "ALL_EXCHANGED" });
        document.getElementById("exchange-section").style.display = "none";
        document.getElementById("word-section").style.display = "block";
        renderHandFinal();
        document.getElementById("word-input").focus();
      }

      // ── 単語確定（英語はAPI判定あり） ────────────────────────────
      async function submitWord() {
        const input = document.getElementById("word-input");
        let word = input.value.trim();
        if (!word) return;
        if (lang === "en") word = word.toUpperCase();

        // 手札チェック
        const handCopy = myHand.map((c) => ({ ...c }));
        let score = 0,
          valid = true;
        const usedIndices = [];
        for (const ch of word) {
          const idx = handCopy.findIndex(
            (c) => c.char === ch && !c._tmpUsed && !c.used,
          );
          if (idx === -1) {
            valid = false;
            break;
          }
          handCopy[idx]._tmpUsed = true;
          score += handCopy[idx].score;
          usedIndices.push(idx);
        }
        if (!valid) {
          alert(L.ui.invalidCard(word));
          input.focus();
          return;
        }

        // 英語版：辞書APIで存在チェック
        if (L.checkWord) {
          setLoading(true);
          const exists = await L.checkWord(word);
          setLoading(false);
          if (!exists) {
            alert(L.ui.invalidWord(word));
            input.focus();
            return;
          }
        }

        // 確定
        input.value = "";
        usedIndices.forEach((i) => {
          myHand[i].used = true;
        });
        myTotalScore += score;
        myWords.push({ word, score });
        renderHandFinal();
        updateWordList();
        input.focus();

        if (myHand.filter((c) => !c.used).length === 0) {
          alert(L.ui.allUsed);
          finishWords();
        }
      }

      function setLoading(on) {
        document.getElementById("loading-msg").style.display = on
          ? "block"
          : "none";
        document.getElementById("submit-btn").disabled = on;
        document.getElementById("word-input").disabled = on;
      }

      function updateWordList() {
        document.getElementById("word-list").innerHTML = myWords
          .map((w) => L.ui.wordRow(w.word, w.score))
          .join("<br>");
      }

      function finishWords() {
        if (iFinished) return;
        iFinished = true;
        document.getElementById("word-input").disabled = true;
        document.getElementById("submit-btn").disabled = true;
        document.getElementById("finish-btn").disabled = true;

        const detail =
          myWords
            .map((w) => `${w.word}(${w.score}${L.ui.scoreUnit})`)
            .join(lang === "ja" ? "、" : ", ") || L.ui.noWord;

        if (isHost) {
          scoreDoneCount++;
          checkAllScored();
        } else {
          hostConn.send({ type: "SCORE", total: myTotalScore, detail });
        }
      }

      function checkAllScored() {
        if (scoreDoneCount < playerCount) return;

        const myDetail =
          myWords
            .map((w) => `${w.word}(${w.score}${L.ui.scoreUnit})`)
            .join(lang === "ja" ? "、" : ", ") || L.ui.noWord;
        const allScores = [
          { name: myName, total: myTotalScore, detail: myDetail },
          ...Object.values(conns).map((g) => ({
            name: g.name,
            total: g.score ?? 0,
            detail: g.detail || L.ui.noWord,
          })),
        ];
        allScores.sort((a, b) => b.total - a.total);

        broadcast({ type: "RESULT", ranking: allScores });
        showResult(allScores);
      }

      function showResult(ranking) {
        document.getElementById("word-section").style.display = "none";
        document.getElementById("exchange-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";

        const tbody = document.getElementById("ranking-body");
        tbody.innerHTML = "";
        ranking.forEach((p, i) => {
          const tr = document.createElement("tr");
          const rankClass = ["rank1", "rank2", "rank3"][i] || "";
          const isMe = p.name === myName;
          tr.className = (rankClass + (isMe ? " me" : "")).trim();
          tr.innerHTML = `<td>${p.name}</td><td style="font-size:13px">${p.detail}</td><td>${p.total}${L.ui.scoreUnit}</td>`;
          tbody.appendChild(tr);
        });

        const label = document.getElementById("result-label");
        const myRank = ranking.findIndex((p) => p.name === myName) + 1;
        const topScore = ranking[0].total;
        const bottomScore = ranking[ranking.length - 1].total;
        if (
          myRank === 1 &&
          ranking.filter((p) => p.total === topScore).length === 1
        ) {
          label.textContent = L.ui.win;
          label.style.color = "#cc0000";
        } else if (
          myRank === ranking.length &&
          ranking.filter((p) => p.total === bottomScore).length === 1
        ) {
          label.textContent = L.ui.last;
          label.style.color = "#0066cc";
        } else {
          label.textContent = L.ui.rank(myRank);
          label.style.color = "#333";
        }
      }

      function requestRematch() {
        iWantRematch = true;
        document.querySelector("#rematch-area button").disabled = true;
        document.getElementById("rematch-status").innerText = L.ui.rematchWait;

        if (isHost) {
          rematchCount++;
          checkAllRematch();
        } else {
          hostConn.send({ type: "REMATCH_REQUEST" });
        }
      }

      function checkAllRematch() {
        const waiting = playerCount - rematchCount;
        if (waiting > 0) {
          document.getElementById("rematch-status").innerText =
            L.ui.rematchCount(waiting);
          return;
        }
        resetGameState();
        initDeck();
        myHand = dealCards(7);
        renderHand();
        Object.values(conns).forEach((g) => {
          g.conn.send({ type: "REMATCH_START", hand: dealCards(7) });
        });
      }
    </script>
  </body>
</html>
