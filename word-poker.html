<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>文字ポーカー対戦ver1.1</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .card {
        display: inline-block;
        width: 50px;
        height: 70px;
        margin: 5px;
        border-radius: 8px;
        line-height: 70px;
        font-size: 24px;
        font-weight: bold;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s;
      }
      .black {
        color: #333;
        border: 2px solid #333;
      }
      .blue {
        color: #0066cc;
        border: 2px solid #0066cc;
      }
      .red {
        color: #cc0000;
        border: 2px solid #cc0000;
      }
      .selected {
        transform: translateY(-10px);
        background: #fff3cd;
      }
      .used {
        opacity: 0.35;
        transform: none !important;
        cursor: default;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
      }
      #game-screen {
        display: none;
      }

      /* ── 単語入力フェーズ ── */
      #word-section {
        display: none;
        margin-top: 10px;
      }

      #word-input-area {
        margin: 10px 0;
        padding: 10px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        display: inline-block;
      }
      #word-input-area input {
        font-size: 22px;
        padding: 6px 10px;
        width: 180px;
        text-align: center;
        border: 2px solid #aaa;
        border-radius: 6px;
        vertical-align: middle;
      }
      #word-input-area button {
        font-size: 16px;
        padding: 8px 14px;
        vertical-align: middle;
      }

      #word-list {
        margin-top: 8px;
        font-size: 16px;
        line-height: 1.8;
      }

      /* ── 結果表示フェーズ ── */
      #result-section {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        font-size: 18px;
      }
      #result-section h2 {
        font-size: 28px;
        margin: 0 0 10px;
      }
      .win {
        color: #cc0000;
      }
      .lose {
        color: #0066cc;
      }
      .draw {
        color: #666;
      }

      #rematch-area {
        margin-top: 16px;
      }
      #rematch-status {
        font-size: 15px;
        color: #888;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>文字ポーカー</h1>

    <!-- 部屋作り・参加画面 -->
    <div id="lobby-screen">
      <input type="text" id="room-input" placeholder="合言葉（例: room123）" />
      <br />
      <button onclick="createRoom()">部屋を作る (ホスト)</button>
      <button onclick="joinRoom()">部屋に参加 (ゲスト)</button>
      <p id="status"></p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen">
      <h2>対戦ルーム: <span id="room-id-display"></span></h2>

      <!-- カード交換フェーズ -->
      <div id="exchange-section">
        <p>あなたの手札（クリックで選択して交換）</p>
        <div id="my-hand"></div>
        <br />
        <button id="exchange-btn" onclick="exchangeCards()">
          選択したカードを交換する（1回のみ）
        </button>
        <h3>相手の手札状況</h3>
        <p id="opponent-status">相手の選択を待っています...</p>
      </div>

      <!-- 単語入力フェーズ -->
      <div id="word-section">
        <p style="font-size: 13px; color: #666; margin: 4px 0">
          手札の文字を使って単語を入力 / 同じ文字を複数回使う場合は複数枚必要
        </p>
        <p style="margin: 6px 0"><strong>あなたの手札</strong></p>
        <div id="my-hand-final"></div>

        <!-- 入力欄：手札のすぐ下 -->
        <div id="word-input-area">
          <input
            type="text"
            id="word-input"
            placeholder="単語を入力"
            onkeydown="if (event.key === 'Enter') submitWord();"
          />
          <button onclick="submitWord()">確定</button>
          <button id="finish-btn" onclick="finishWords()">終了→結果へ</button>
        </div>

        <div id="word-list"></div>
      </div>

      <!-- 結果表示フェーズ -->
      <div id="result-section">
        <p>あなたの得点</p>
        <p id="my-score-detail" style="font-size: 15px; color: #555"></p>
        <p><strong id="my-total-score" style="font-size: 22px"></strong></p>
        <hr />
        <p>相手の得点</p>
        <p id="opp-score-detail" style="font-size: 15px; color: #555"></p>
        <p><strong id="opp-total-score" style="font-size: 22px"></strong></p>
        <h2 id="result-label"></h2>
        <div id="rematch-area">
          <button onclick="requestRematch()">🔄 再戦する</button>
          <p id="rematch-status"></p>
        </div>
      </div>
    </div>

    <script>
      // ── 文字リスト（レアリティ別） ──────────────────────────────
      const rawList = [
        "の",
        "に",
        "た",
        "い",
        "は",
        "を",
        "と",
        "る",
        "が",
        "し",
        "で",
        "て",
        "な",
        "か",
        "れ",
        "ら",
        "も",
        "う",
        "す",
        "り",
        "こ",
        "だ",
        "ま",
        "さ",
        "き",
        "め",
        "く",
        "あ",
        "け",
        "ど",
        "ん",
        "え",
        "よ",
        "つ",
        "や",
        "そ",
        "わ",
        "ち",
        "み",
        "せ",
        "ろ",
        "ば",
        "お",
        "じ",
        "べ",
        "ず",
        "げ",
        "ほ",
        "へ",
        "び",
        "む",
        "ご",
        "ね",
        "ぶ",
        "ぐ",
        "ぎ",
        "ひ",
        "づ",
        "ぼ",
        "ざ",
        "ふ",
        "ぞ",
        "ゆ",
        "ぜ",
        "ぬ",
        "ぱ",
        "ぴ",
        "ぽ",
        "ぷ",
        "ぺ",
        "ぢ",
        "ー",
      ];

      let deck = [];
      let myHand = [];
      let hasExchanged = false;
      let opponentExchanged = false;
      let myWords = [];
      let myTotalScore = 0;
      let opponentFinished = false;
      let opponentScore = null;
      let opponentDetail = null;
      let iFinished = false;
      let iWantRematch = false;
      let opponentWantsRematch = false;
      let peer, conn;
      let isHost = false;

      // ── デッキ初期化 ────────────────────────────────────────────
      function initDeck() {
        deck = [];
        rawList.forEach((char, index) => {
          let count, color, score;
          if (index < 15) {
            count = 3;
            color = "black";
            score = 1;
          } else if (index < 35) {
            count = 2;
            color = "blue";
            score = 2;
          } else {
            count = 1;
            color = "red";
            score = 3;
          }
          for (let i = 0; i < count; i++) deck.push({ char, color, score });
        });
        deck.sort(() => Math.random() - 0.5);
      }

      // ── ゲーム状態リセット ───────────────────────────────────────
      function resetGame() {
        deck = [];
        myHand = [];
        hasExchanged = false;
        opponentExchanged = false;
        myWords = [];
        myTotalScore = 0;
        opponentFinished = false;
        opponentScore = null;
        opponentDetail = null;
        iFinished = false;
        iWantRematch = false;
        opponentWantsRematch = false;

        // UI リセット
        document.getElementById("result-section").style.display = "none";
        document.getElementById("word-section").style.display = "none";
        document.getElementById("exchange-section").style.display = "block";
        document.getElementById("exchange-btn").disabled = false;
        document.getElementById("opponent-status").innerText =
          "相手の選択を待っています...";
        document.getElementById("word-list").innerHTML = "";
        document.getElementById("word-input").value = "";
        document.getElementById("word-input").disabled = false;
        document.getElementById("finish-btn").disabled = false;
        document.getElementById("rematch-status").innerText = "";
        document.getElementById("my-hand").innerHTML = "";
        document.getElementById("my-hand-final").innerHTML = "";
      }

      // ── 部屋作成（ホスト） ──────────────────────────────────────
      function createRoom() {
        const roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        isHost = true;

        peer = new Peer("wordpoker-" + roomName);
        peer.on("open", () => {
          document.getElementById("status").innerText =
            "部屋を作りました。相手の参加を待っています...";
        });
        peer.on("connection", (c) => {
          conn = c;
          setupConnection();
          conn.on("open", () => {
            showGame(roomName);
            startGameAsHost();
          });
        });
      }

      // ── 部屋参加（ゲスト） ──────────────────────────────────────
      function joinRoom() {
        const roomName = document.getElementById("room-input").value.trim();
        if (!roomName) return alert("合言葉を入力してください");
        isHost = false;

        peer = new Peer();
        peer.on("open", () => {
          conn = peer.connect("wordpoker-" + roomName);
          setupConnection();
          conn.on("open", () => {
            showGame(roomName);
          });
        });
      }

      // ── ゲーム画面表示 ──────────────────────────────────────────
      function showGame(roomName) {
        document.getElementById("lobby-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("room-id-display").innerText = roomName;
      }

      // ── 通信受信 ────────────────────────────────────────────────
      function setupConnection() {
        conn.on("data", (data) => {
          if (data.type === "HAND") {
            myHand = data.hand;
            renderHand();
          } else if (data.type === "EXCHANGE_DONE") {
            opponentExchanged = true;
            document.getElementById("opponent-status").innerText =
              "相手はカード交換を終えました ✅";
            checkBothExchanged();
          } else if (data.type === "SCORE") {
            opponentScore = data.total;
            opponentDetail = data.detail;
            opponentFinished = true;
            checkBothFinished();
          } else if (data.type === "REMATCH_REQUEST") {
            opponentWantsRematch = true;
            checkBothRematch();
          } else if (data.type === "REMATCH_START") {
            // ホストから再戦開始の合図（手札付き）
            resetGame();
            myHand = data.hand;
            renderHand();
          }
          // ※ resetGame() 後に exchange-section は block に戻るので追加不要
        });
      }

      // ── ホスト：デッキ作成＆手札配布 ────────────────────────────
      function startGameAsHost() {
        initDeck();
        const guestHand = deck.splice(0, 7);
        myHand = deck.splice(0, 7);
        renderHand();
        conn.send({ type: "HAND", hand: guestHand });
      }

      // ── 手札表示（交換フェーズ） ─────────────────────────────────
      function renderHand() {
        const container = document.getElementById("my-hand");
        container.innerHTML = "";
        myHand.forEach((card, index) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}`;
          div.innerText = card.char;
          div.onclick = () => div.classList.toggle("selected");
          div.dataset.index = index;
          container.appendChild(div);
        });
      }

      // ── 手札表示（単語入力フェーズ） ────────────────────────────
      function renderHandFinal() {
        const container = document.getElementById("my-hand-final");
        container.innerHTML = "";
        myHand.forEach((card) => {
          const div = document.createElement("div");
          div.className = `card ${card.color}` + (card.used ? " used" : "");
          div.innerText = card.char;
          container.appendChild(div);
        });
      }

      // ── カード交換 ───────────────────────────────────────────────
      function exchangeCards() {
        if (hasExchanged) return alert("交換は1回までです！");

        const selectedDivs = document.querySelectorAll("#my-hand .selected");
        const indicesToReplace = Array.from(selectedDivs).map((div) =>
          parseInt(div.dataset.index),
        );

        if (indicesToReplace.length === 0) {
          if (!confirm("1枚も交換しませんか？")) return;
        }

        indicesToReplace.forEach((index) => {
          myHand[index] = drawRandom();
        });

        hasExchanged = true;
        document.getElementById("exchange-btn").disabled = true;
        renderHand();
        conn.send({ type: "EXCHANGE_DONE" });
        checkBothExchanged();
      }

      // ── ランダムに1枚引く（レアリティ加重） ─────────────────────
      function drawRandom() {
        const pool = [];
        rawList.forEach((char, index) => {
          let count, color, score;
          if (index < 15) {
            count = 3;
            color = "black";
            score = 1;
          } else if (index < 35) {
            count = 2;
            color = "blue";
            score = 2;
          } else {
            count = 1;
            color = "red";
            score = 3;
          }
          for (let i = 0; i < count; i++) pool.push({ char, color, score });
        });
        return pool[Math.floor(Math.random() * pool.length)];
      }

      // ── 双方が交換完了したら単語入力フェーズへ ──────────────────
      function checkBothExchanged() {
        if (!hasExchanged || !opponentExchanged) return;
        document.getElementById("exchange-section").style.display = "none";
        document.getElementById("word-section").style.display = "block";
        renderHandFinal();
        // 入力欄にフォーカス
        document.getElementById("word-input").focus();
      }

      // ── 単語確定 ─────────────────────────────────────────────────
      function submitWord() {
        const input = document.getElementById("word-input");
        const word = input.value.trim();
        if (!word) return;
        input.value = "";

        const handCopy = myHand.map((c) => ({ ...c }));
        let score = 0;
        let valid = true;
        const usedIndices = [];

        for (const ch of word) {
          const idx = handCopy.findIndex(
            (c) => c.char === ch && !c._tmpUsed && !c.used,
          );
          if (idx === -1) {
            valid = false;
            break;
          }
          handCopy[idx]._tmpUsed = true;
          score += handCopy[idx].score;
          usedIndices.push(idx);
        }

        if (!valid) {
          alert(`「${word}」は手札にない文字が含まれています。`);
          input.focus();
          return;
        }

        usedIndices.forEach((i) => {
          myHand[i].used = true;
        });
        myTotalScore += score;
        myWords.push({ word, score });

        renderHandFinal();
        updateWordList();
        input.focus();

        const remaining = myHand.filter((c) => !c.used);
        if (remaining.length === 0) {
          alert("手札をすべて使いました！");
          finishWords();
        }
      }

      // ── 単語リスト表示 ───────────────────────────────────────────
      function updateWordList() {
        const el = document.getElementById("word-list");
        el.innerHTML = myWords
          .map((w) => `✅ <strong>${w.word}</strong>：${w.score}点`)
          .join("<br>");
      }

      // ── 単語入力終了→得点送信 ────────────────────────────────────
      function finishWords() {
        if (iFinished) return;
        iFinished = true;
        document.getElementById("word-input").disabled = true;
        document.getElementById("finish-btn").disabled = true;

        const detail =
          myWords.map((w) => `${w.word}(${w.score}点)`).join("、") ||
          "単語なし";
        conn.send({ type: "SCORE", total: myTotalScore, detail });
        checkBothFinished();
      }

      // ── 双方の得点が揃ったら結果表示 ────────────────────────────
      function checkBothFinished() {
        if (!iFinished || !opponentFinished) return;

        document.getElementById("word-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";

        const myDetail =
          myWords.map((w) => `${w.word}(${w.score}点)`).join("、") ||
          "単語なし";
        document.getElementById("my-score-detail").innerText = myDetail;
        document.getElementById("my-total-score").innerText =
          `合計 ${myTotalScore} 点`;
        document.getElementById("opp-score-detail").innerText =
          opponentDetail || "単語なし";
        document.getElementById("opp-total-score").innerText =
          `合計 ${opponentScore} 点`;

        const label = document.getElementById("result-label");
        if (myTotalScore > opponentScore) {
          label.textContent = "🎉 あなたの勝ち！";
          label.className = "win";
        } else if (myTotalScore < opponentScore) {
          label.textContent = "😢 あなたの負け…";
          label.className = "lose";
        } else {
          label.textContent = "🤝 引き分け！";
          label.className = "draw";
        }
      }

      // ── 再戦リクエスト ───────────────────────────────────────────
      function requestRematch() {
        iWantRematch = true;
        document.querySelector("#rematch-area button").disabled = true;
        document.getElementById("rematch-status").innerText =
          "再戦リクエストを送りました。相手を待っています...";
        conn.send({ type: "REMATCH_REQUEST" });
        checkBothRematch();
      }

      // ── 双方が再戦を希望したらゲームを再開 ──────────────────────
      function checkBothRematch() {
        if (!iWantRematch || !opponentWantsRematch) {
          if (opponentWantsRematch && !iWantRematch) {
            document.getElementById("rematch-status").innerText =
              "相手が再戦を希望しています！";
          }
          return;
        }
        // 両方揃った
        if (isHost) {
          // ホスト：新しいデッキで手札を配り、ゲストに REMATCH_START を送る
          resetGame();
          initDeck();
          const guestHand = deck.splice(0, 7);
          myHand = deck.splice(0, 7);
          renderHand();
          conn.send({ type: "REMATCH_START", hand: guestHand });
        }
        // ゲストは REMATCH_START 受信時に resetGame するので何もしない
      }
    </script>
  </body>
</html>
